name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: 拉取代码
      uses: actions/checkout@v4
    
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装 PyInstaller
      run: pip install pyinstaller
    
    - name: 打包成 EXE
      run: pyinstaller -F --name=考勤打卡 attendance.py
    
    - name: 上传 EXE
      uses: actions/upload-artifact@v4
      with:
        name: 考勤打卡
        path: dist/考勤打卡.exe
